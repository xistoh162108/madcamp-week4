<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Pro Skeleton Visualizer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: white; font-family: monospace; }
        
        #info { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            background: rgba(0,0,0,0.7); 
            padding: 15px; 
            border-radius: 8px;
            pointer-events: none; 
            z-index: 10;
        }
        
        .label-container {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            pointer-events: none;
            justify-content: space-around;
            font-size: 1.2em;
            font-weight: bold;
            text-shadow: 2px 2px 4px black;
            z-index: 5;
        }
        .view-label { 
            width: 33%; 
            text-align: center; 
            padding: 10px 0;
            border-bottom: 2px solid rgba(255,255,255,0.3);
        }
        
        #controls-container {
             position: absolute; 
             bottom: 20px; 
             left: 50%; 
             transform: translateX(-50%); 
             display: flex; 
             gap: 10px;
             z-index: 10;
        }
        
        button { 
            padding: 8px 16px; 
            background: #333; 
            color: white; 
            border: 1px solid #555; 
            cursor: pointer; 
            border-radius: 4px; 
            font-family: inherit;
        }
        button:hover { background: #555; }

        /* Data Inspector Panel */
        #inspector {
            display: none;
            position: absolute;
            top: 150px;
            left: 10px;
            width: 300px;
            height: 60%;
            background: rgba(0,0,0,0.85);
            border: 1px solid #00ff00;
            border-radius: 8px;
            padding: 10px;
            color: #00ff00;
            overflow: auto;
            z-index: 20;
            font-size: 11px;
            white-space: pre-wrap; 
            word-break: break-all;
        }

        /* Calibration Overlay */
        #calib-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #calib-timer {
            font-size: 5em;
            color: #00ffff;
            font-weight: bold;
        }
        #calib-msg {
            font-size: 1.5em;
            color: white;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="calib-overlay">
        <div id="calib-timer">5</div>
        <div id="calib-msg">Stand Upright & Move Head Slightly...</div>
    </div>

    <div id="info">
        <h3 style="margin: 0 0 10px 0;">Madcamp Week 4</h3>
        <div id="status">Waiting for data...</div>
        <div id="height-status" style="color: #aaaaaa; margin-top: 5px;">Height: 1.70m (Default)</div>
        <div id="latency">UDP Latency: -</div>
        <div id="ml-latency" style="color: cyan; font-weight: bold;">ML Inference: -</div>
        <div style="margin-top: 10px; font-size: 0.8em; color: #aaa;">
            Controls: Left Click (Rotate), Right Click (Pan)
        </div>
    </div>
    
    <div class="label-container">
        <div class="view-label" style="background: rgba(50,0,0,0.3); color: #ffaaaa">1. Raw Data (VR)</div>
        <div class="view-label" style="background: rgba(0,50,0,0.3); color: #aaffaa">2. Pelvis Estimation</div>
        <div class="view-label" style="background: rgba(0,0,50,0.3); color: #aaaaff">3. Full Skeleton (+Hands)</div>
    </div>
    
    <!-- Vertical Separators -->
    <div style="position: absolute; top: 0; bottom: 0; left: 33.3%; width: 2px; background: rgba(255,255,255,0.3); pointer-events: none; z-index: 5;"></div>
    <div style="position: absolute; top: 0; bottom: 0; left: 66.6%; width: 2px; background: rgba(255,255,255,0.3); pointer-events: none; z-index: 5;"></div>
    
    <!-- Inspector Panel -->
    <div id="inspector">
        <div style="border-bottom: 1px solid #00aa00; margin-bottom: 5px; padding-bottom: 5px; font-weight: bold;">Raw Data Inspector</div>
        <div id="inspector-content">Waiting...</div>
    </div>

    <div id="controls-container">
        <button onclick="setCamera('front')">Front</button>
        <button onclick="setCamera('top')">Top</button>
        <button onclick="setCamera('side')">Side</button>
        <button onclick="toggleAutoRotate()">Auto Rotate</button>
        <button onclick="toggleInspector()" style="border-color: #00ff00; color: #00ff00;">Raw Data</button>
        <button onclick="copySnapshot()" style="border-color: #00ffff; color: #00ffff;">Copy Snapshot</button>
        <button onclick="startCalibration()" style="background: #000088; border-color: #5555ff; color: white;">Calibrate Height (5s)</button>
        <button onclick="logToConsole()" style="background: #004400;">Log to Console</button>
    </div>

    <!-- Libraries -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // --- 1. Init ---
        const socket = io();
        const statusDiv = document.getElementById('status');
        const latencyDiv = document.getElementById('latency');
        const mlLatencyDiv = document.getElementById('ml-latency');
        const inspectorDiv = document.getElementById('inspector');
        const inspectorContent = document.getElementById('inspector-content');
        let lastUpdate = Date.now();
        
        // Debug Data State
        const debugData = { udp: null, ml: null };
        
        // Latency Smoothing Helper
        class LatencySmoother {
            constructor(windowSize) {
                this.samples = [];
                this.windowSize = windowSize;
            }
            add(val) {
                this.samples.push(val);
                if (this.samples.length > this.windowSize) this.samples.shift();
            }
            get average() {
                if (this.samples.length === 0) return 0;
                const sum = this.samples.reduce((a, b) => a + b, 0);
                return sum / this.samples.length;
            }
        }
        // UDP ~90Hz -> 90 samples for 1s average
        const udpSmoother = new LatencySmoother(90);
        // ML ~30Hz -> 30 samples for 1s average
        const mlSmoother = new LatencySmoother(30);

        // Scene
        const scene = new THREE.Scene();
        
        // Groups for Multi-View
        const groupRaw = new THREE.Group();
        const groupPelvis = new THREE.Group();
        const groupSkeleton = new THREE.Group();
        
        scene.add(groupRaw);
        scene.add(groupPelvis);
        scene.add(groupSkeleton);

        // Camera
        const camera = new THREE.PerspectiveCamera(50, (window.innerWidth / 3) / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.5, 4);
        
        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setScissorTest(true);
        renderer.autoClear = false;
        document.body.appendChild(renderer.domElement);
        
        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.0, 0);
        controls.enableDamping = true;
        
        // --- 2. Environment ---
        const grid = new THREE.GridHelper(10, 10, 0x888888, 0x333333);
        scene.add(grid);
        const axes = new THREE.AxesHelper(1.0);
        scene.add(axes);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(2, 5, 5);
        scene.add(dirLight);
        scene.add(new THREE.AmbientLight(0x666666));

        // --- 3. Objects Setup ---
        
        // Helper to create hand dots
        function createHandDots(group, color) {
            for(let i=0; i < 25; i++) {
                const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.015), new THREE.MeshBasicMaterial({ color: color }));
                group.add(mesh);
            }
        }

        // [View 1] Raw Data
        const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.1, 32, 32), new THREE.MeshStandardMaterial({ color: 0xff0000 }));
        groupRaw.add(headMesh);
        
        const leftHandGroup = new THREE.Group();
        const rightHandGroup = new THREE.Group();
        groupRaw.add(leftHandGroup);
        groupRaw.add(rightHandGroup);
        createHandDots(leftHandGroup, 0x00ff00);
        createHandDots(rightHandGroup, 0x0000ff);

        // Vector Helpers (Raw View)
        const gazeArrow = new THREE.ArrowHelper(new THREE.Vector3(0,0,-1), new THREE.Vector3(0,0,0), 0.5, 0x00ffff);
        groupRaw.add(gazeArrow);
        const leftPalmArrow = new THREE.ArrowHelper(new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,0), 0.3, 0xffff00);
        groupRaw.add(leftPalmArrow);
        const rightPalmArrow = new THREE.ArrowHelper(new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,0), 0.3, 0xffff00);
        groupRaw.add(rightPalmArrow);

        // [View 2] Pelvis Heuristic
        const pelvisMesh = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffff00, wireframe: true }));
        groupPelvis.add(pelvisMesh);
        const heuristicLine = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
            new THREE.LineBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.6 })
        );
        groupPelvis.add(heuristicLine);

        // [View 3] Full Skeleton + Overlay
        const jointsMap = {};
        const fullBodyBones = [];
        
        // Standard Skeleton Joints
        ['head', 'neck', 'spine', 'pelvis', 'leftShoulder', 'rightShoulder', 'leftElbow', 'rightElbow', 'leftHand', 'rightHand', 'leftKnee', 'rightKnee', 'leftAnkle', 'rightAnkle'].forEach(name => {
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.035), new THREE.MeshStandardMaterial({ color: 0xdddddd }));
            jointsMap[name] = mesh;
            groupSkeleton.add(mesh);
        });
        
        const SKELETON_PAIRS = [
            ['head', 'neck'], ['neck', 'spine'], ['spine', 'pelvis'],
            ['pelvis', 'leftKnee'], ['leftKnee', 'leftAnkle'],
            ['pelvis', 'rightKnee'], ['rightKnee', 'rightAnkle'],
            ['neck', 'leftShoulder'], ['leftShoulder', 'leftElbow'], ['leftElbow', 'leftHand'],
            ['neck', 'rightShoulder'], ['rightShoulder', 'rightElbow'], ['rightElbow', 'rightHand']
        ];
        SKELETON_PAIRS.forEach(pair => {
            const line = new THREE.Line(
                new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
                new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 })
            );
            line.userData = { start: pair[0], end: pair[1] };
            groupSkeleton.add(line);
            fullBodyBones.push(line);
        });
        
        // --- Overlay: Detailed Hands & Vectors for Skeleton View ---
        const leftHandSkelGroup = new THREE.Group();
        const rightHandSkelGroup = new THREE.Group();
        groupSkeleton.add(leftHandSkelGroup);
        groupSkeleton.add(rightHandSkelGroup);
        createHandDots(leftHandSkelGroup, 0x00ff00); // reuse creation
        createHandDots(rightHandSkelGroup, 0x0000ff);
        
        // Vectors for Skeleton View
        const gazeArrowSkel = new THREE.ArrowHelper(new THREE.Vector3(0,0,-1), new THREE.Vector3(0,0,0), 0.5, 0x00ffff);
        groupSkeleton.add(gazeArrowSkel);
        const leftPalmArrowSkel = new THREE.ArrowHelper(new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,0), 0.3, 0xffff00);
        groupSkeleton.add(leftPalmArrowSkel);
        const rightPalmArrowSkel = new THREE.ArrowHelper(new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,0), 0.3, 0xffff00);
        groupSkeleton.add(rightPalmArrowSkel);

        // --- 4. Logic Updates ---
        
        function updateObjectRaw(object, floatArray) {
            if (!floatArray || floatArray.length < 16) return;
            const m = new THREE.Matrix4().fromArray(floatArray);
            m.decompose(object.position, object.quaternion, object.scale);
        }
        
        function updateHandJoints(group, floatArray) {
             if (!floatArray) return;
             group.children.forEach((mesh, i) => {
                 const start = i*16;
                 if (start + 16 <= floatArray.length) {
                     updateObjectRaw(mesh, floatArray.slice(start, start+16));
                 }
             });
        }

        let latestHeadPos = new THREE.Vector3();

        socket.on('pose_update', (data) => {
            statusDiv.innerText = "UDP Connected";
            lastUpdate = Date.now();
            debugData.udp = data;
            
            if (data.timestamp) {
                 const lat = Date.now() - data.timestamp;
                 udpSmoother.add(lat);
                 latencyDiv.innerText = `UDP Latency: ${udpSmoother.average.toFixed(1)} ms (Avg 1s)`;
            }

            if (data.head) {
                // View 1 Update
                updateObjectRaw(headMesh, data.head);
                latestHeadPos.copy(headMesh.position);
                
                // View 1 Gaze
                if (data.headForward) {
                    const dir = new THREE.Vector3(data.headForward[0], data.headForward[1], data.headForward[2]).normalize();
                    gazeArrow.position.copy(headMesh.position);
                    gazeArrow.setDirection(dir);
                    
                    // View 3 Gaze (Overlay)
                    if (jointsMap['head']) {
                         // We use the UDP head pos for the arrow origin to be perfectly synced with gaze
                         gazeArrowSkel.position.copy(headMesh.position); 
                         gazeArrowSkel.setDirection(dir);
                    }
                }
                
                // View 2 Heuristic
                pelvisMesh.position.copy(headMesh.position);
                pelvisMesh.position.y -= 0.55;
                heuristicLine.geometry.setFromPoints([headMesh.position, pelvisMesh.position]);
                heuristicLine.geometry.attributes.position.needsUpdate = true;
            }
            
            // Hand Updates (Both Views)
            if (data.leftHand) {
                updateHandJoints(leftHandGroup, data.leftHand); // View 1
                updateHandJoints(leftHandSkelGroup, data.leftHand); // View 3 (Overlay)
                
                if (data.leftPalmNormal && leftHandGroup.children.length > 0) {
                     const pos = leftHandGroup.children[0].position;
                     const dir = new THREE.Vector3(data.leftPalmNormal[0], data.leftPalmNormal[1], data.leftPalmNormal[2]).normalize();
                     
                     // View 1
                     leftPalmArrow.position.copy(pos);
                     leftPalmArrow.setDirection(dir);
                     
                     // View 3
                     leftPalmArrowSkel.position.copy(pos);
                     leftPalmArrowSkel.setDirection(dir);
                }
            }
            if (data.rightHand) {
                updateHandJoints(rightHandGroup, data.rightHand); // View 1
                updateHandJoints(rightHandSkelGroup, data.rightHand); // View 3 (Overlay)
                
                 if (data.rightPalmNormal && rightHandGroup.children.length > 0) {
                     const pos = rightHandGroup.children[0].position;
                     const dir = new THREE.Vector3(data.rightPalmNormal[0], data.rightPalmNormal[1], data.rightPalmNormal[2]).normalize();
                     
                     // View 1
                     rightPalmArrow.position.copy(pos);
                     rightPalmArrow.setDirection(dir);
                     
                     // View 3
                     rightPalmArrowSkel.position.copy(pos);
                     rightPalmArrowSkel.setDirection(dir);
                }
            }
            
            updateInspector();
        });
        
        socket.on('full_skeleton', (skel) => {
             debugData.ml = skel;
             Object.keys(skel).forEach(name => {
                 if (jointsMap[name]) jointsMap[name].position.set(skel[name][0], skel[name][1], skel[name][2]);
             });
             
             fullBodyBones.forEach(bone => {
                const s = jointsMap[bone.userData.start].position;
                const e = jointsMap[bone.userData.end].position;
                bone.geometry.setFromPoints([s, e]);
                bone.geometry.attributes.position.needsUpdate = true;
             });
             
             if (skel.ml_latency_ms) {
                 mlSmoother.add(skel.ml_latency_ms);
                 mlLatencyDiv.innerText = `ML Inference: ${mlSmoother.average.toFixed(1)} ms (Avg 1s)`;
             } else {
                 mlLatencyDiv.innerText = "ML Inference: MISSING (Restart Python Server)";
             }
             
             updateInspector();
        });

        // --- 5. Rendering Loop ---
        let isAutoRotate = false;
        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            if (isAutoRotate) {
                 const time = Date.now() * 0.0005;
                 camera.position.x = Math.sin(time) * 4;
                 camera.position.z = Math.cos(time) * 4;
                 camera.lookAt(0, 1, 0);
            }

            const w = window.innerWidth;
            const h = window.innerHeight;
            const third = Math.floor(w / 3);

            // 1. Raw Data View (Dark Red)
            renderer.setViewport(0, 0, third, h);
            renderer.setScissor(0, 0, third, h);
            renderer.setClearColor(0x220000); 
            renderer.clear(); 
            
            groupRaw.visible = true;
            groupPelvis.visible = false;
            groupSkeleton.visible = false;
            renderer.render(scene, camera);

            // 2. Pelvis View (Dark Green)
            renderer.setViewport(third, 0, third, h);
            renderer.setScissor(third, 0, third, h);
            renderer.setClearColor(0x002200);
            renderer.clear();
            
            groupRaw.visible = true; 
            groupPelvis.visible = true; 
            groupSkeleton.visible = false;
            renderer.render(scene, camera);

            // 3. Skeleton View (Dark Blue)
            renderer.setViewport(third * 2, 0, third, h);
            renderer.setScissor(third * 2, 0, third, h);
            renderer.setClearColor(0x000022);
            renderer.clear();
            
            groupRaw.visible = false;
            groupPelvis.visible = false;
            groupSkeleton.visible = true;
            renderer.render(scene, camera);
        }
        animate();

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = (window.innerWidth / 3) / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.setCamera = (view) => {
            if(view === 'front') { camera.position.set(0, 1.5, 3); camera.lookAt(0, 1, 0); }
            if(view === 'top') { camera.position.set(0, 4, 0.1); camera.lookAt(0, 1, 0); }
            if(view === 'side') { camera.position.set(3, 1.5, 0); camera.lookAt(0, 1, 0); }
        };
        window.toggleAutoRotate = () => { isAutoRotate = !isAutoRotate; };
        
        window.toggleInspector = () => {
            const el = document.getElementById('inspector');
            el.style.display = el.style.display === 'none' ? 'block' : 'none';
        };
        
        window.logToConsole = () => {
            console.log("--- Snapshot ---");
            console.log("UDP Packet:", debugData.udp);
            console.log("ML Packet:", debugData.ml);
        };
        
        window.copySnapshot = () => {
            const snapshot = {
                timestamp: Date.now(),
                raw_udp: debugData.udp,
                ml_skeleton: debugData.ml,
                client_pelvis: groupPelvis.children[0].position
            };
            
            const json = JSON.stringify(snapshot, null, 2);
            
            // Clipboard API with fallback
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(json).then(() => {
                    alert("Snapshot copied to clipboard! 📋");
                }).catch(err => {
                    console.error("Clipboard failed:", err);
                    prompt("Copy this JSON:", json);
                });
            } else {
                prompt("Copy this JSON:", json);
            }
        };
        
        window.startCalibration = async () => {
             const overlay = document.getElementById('calib-overlay');
             const timerDiv = document.getElementById('calib-timer');
             const msgDiv = document.getElementById('calib-msg');
             
             overlay.style.display = 'flex';
             timerDiv.style.color = '#ffff00'; // Yellow for Prep
             
             // --- Phase 1: Preparation (5s) ---
             msgDiv.innerText = "Get Ready... Stand Upright";
             for (let i = 5; i > 0; i--) {
                 timerDiv.innerText = i;
                 await new Promise(r => setTimeout(r, 1000));
             }
             
             // --- Phase 2: Measurement (3s) ---
             msgDiv.innerText = "Measuring... Move Head Slightly";
             msgDiv.style.color = "#00ff00"; // Green for Measure
             timerDiv.style.color = "#00ff00";
             
             // Reset & Start Collecting on Server
             await fetch('/calibrate/start', { method: 'POST' });
             
             for (let i = 3; i > 0; i--) {
                 timerDiv.innerText = i;
                 await new Promise(r => setTimeout(r, 1000));
             }
             
             // --- Phase 3: Finish ---
             msgDiv.innerText = "Processing...";
             msgDiv.style.color = "white";
             
             try {
                 const res = await fetch('/calibrate/finish', { method: 'POST' });
                 if (!res.ok) throw new Error(`Server error: ${res.status}`);
                 const data = await res.json();
                 
                 // Update UI Status
                 const heightDisplay = document.getElementById('height-status');
                 if (heightDisplay) {
                    heightDisplay.innerText = `Height: ${data.height.toFixed(2)}m (Calibrated)`;
                    heightDisplay.style.color = "#00ff00";
                 }
                 
             } catch (e) {
                 console.error("Calibration failed:", e);
                 alert("Calibration failed (check console). Using default height.");
             } finally {
                 overlay.style.display = 'none'; // Return to main page
                 // Reset styles
                 msgDiv.style.color = "white";
                 timerDiv.style.color = "#00ffff";
             }
        };

        function updateInspector() {
            if (inspectorDiv.style.display === 'none') return;
            
            const summary = {
                "UDP Packet": debugData.udp ? {
                    timestamp: debugData.udp.timestamp?.toFixed(0),
                    head: debugData.udp.head ? "[Matrix 4x4 Received]" : "MISSING",
                    hands: (debugData.udp.leftHand || debugData.udp.rightHand) ? "Received" : "None"
                } : "Waiting for Vision Pro...",
                
                "ML Packet": debugData.ml ? {
                    latency_key: debugData.ml.ml_latency_ms !== undefined ? "FOUND" : "MISSING",
                    ml_latency: debugData.ml.ml_latency_ms,
                    skeleton_joints: Object.keys(debugData.ml).length
                } : "Waiting for Python Server..."
            };
            
            inspectorContent.innerText = JSON.stringify(summary, null, 2);
        }
    </script>
</body>
</html>
